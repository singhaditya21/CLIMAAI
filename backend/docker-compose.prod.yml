# ClimaAI Production Docker Compose
# Use this for staging/production deployments
# For local development, use docker-compose.yml instead

version: '3.8'

services:
  # ==========================================================================
  # FastAPI Backend (Production)
  # ==========================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: climaai-api-prod
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    env_file:
      - ./api/.env.production
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - climaai-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # PostgreSQL Database (Production)
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: climaai-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - climaai-prod
    # Don't expose ports in production - internal network only
    # Use a bastion host or Cloud SQL Proxy for admin access

  # ==========================================================================
  # Redis Cache (Production)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: climaai-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - climaai-prod
    # Don't expose ports in production

  # ==========================================================================
  # Nginx Reverse Proxy / Load Balancer
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: climaai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: always
    networks:
      - climaai-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Payment Webhook Service (if needed)
  # ==========================================================================
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: climaai-payments-prod
    environment:
      - NODE_ENV=production
    env_file:
      - ./payment-service/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - climaai-prod

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  climaai-prod:
    driver: bridge
