version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: climaai-postgres
    environment:
      POSTGRES_USER: climaai
      POSTGRES_PASSWORD: climaai123
      POSTGRES_DB: climaai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Numeric prefixes force the entrypoint to apply these in order
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./002_add_features.sql:/docker-entrypoint-initdb.d/02-add-features.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climaai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - climaai-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: climaai-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - climaai-network

  # FastAPI Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: climaai-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://climaai:climaai123@postgres:5432/climaai
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - climaai-network
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Payment Webhook Service
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: climaai-payment-service
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=climaai
      - DB_PASSWORD=climaai123
      - DB_NAME=climaai
    env_file:
      - ./payment-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - climaai-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  climaai-network:
    driver: bridge
