# ClimaAI CI/CD Pipeline
# Deploy to Google Cloud Run on push to main

name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: climaai-api
  # Artifact Registry, not gcr.io: new GCP projects cannot push to Container
  # Registry (deprecated, and its backing bucket is never provisioned), so a
  # gcr.io push fails on exactly the fresh project this pipeline targets.
  # scripts/deploy/bootstrap-gcp.sh creates the 'climaai' repository.
  AR_REPO: climaai

jobs:
  # ==========================================================================
  # Build and Test
  # ==========================================================================
  test:
    runs-on: ubuntu-latest

    # The suite runs against real Postgres, not SQLite: several handlers use
    # Postgres-only SQL (jsonb casts, `= ANY(:array)`) that SQLite cannot run,
    # so a SQLite run would pass while saying nothing about production.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: climaai
          POSTGRES_PASSWORD: climaai123
          POSTGRES_DB: climaai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint
        run: |
          cd backend/api
          ruff check .

      - name: Run tests
        run: |
          cd backend/api
          python -m pytest tests/ -v
        env:
          # conftest.py creates the test database and applies init.sql and
          # 002_add_features.sql to it.
          TEST_DATABASE_URL: postgresql://climaai:climaai123@localhost:5432/climaai_test
          DATABASE_URL: postgresql+asyncpg://climaai:climaai123@localhost:5432/climaai
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key
          OPENAI_API_KEY: test-key
          # Makes an unreachable database a hard failure rather than a skip.
          CI: "true"

  # ==========================================================================
  # Build Docker Image
  # ==========================================================================
  build:
    needs: test
    # Deployment has never been configured: GCP_SA_KEY is unset, so this job
    # failed at 'Authenticate to Google Cloud' on every backend push — a
    # permanent red that says nothing. Skip cleanly until the secrets exist;
    # the moment they are added, deploys resume with no other change.
    # Both secrets are required: a key without a project id builds an image
    # path with an empty segment and fails at push, after auth succeeded.
    # (`secrets` cannot appear in an `if:`, hence the env indirection.)
    env:
      HAS_GCP: ${{ secrets.GCP_SA_KEY != '' && secrets.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      configured: ${{ steps.creds.outputs.configured }}
      
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials
        id: creds
        run: |
          if [ "$HAS_GCP" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_SA_KEY and/or GCP_PROJECT_ID is not set — build/deploy steps are skipped, not failed. Run scripts/deploy/bootstrap-gcp.sh to set both and enable deploys."
          fi

      - name: Set up Docker Buildx
        if: ${{ env.HAS_GCP == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        if: ${{ env.HAS_GCP == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        if: ${{ env.HAS_GCP == 'true' }}
        # configure-docker needs the registry host spelled out; bare
        # `configure-docker` only covers the deprecated gcr.io hosts.
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and Push
        if: ${{ env.HAS_GCP == 'true' }}
        id: build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE_NAME}:${{ github.sha }}"
          docker build -t ${IMAGE} ./backend/api
          docker push ${IMAGE}
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

  # ==========================================================================
  # Deploy to Cloud Run
  # ==========================================================================
  deploy:
    needs: build
    # Skipped (not failed) while no GCP credential is configured.
    if: ${{ needs.build.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ needs.build.outputs.image }}
          region: ${{ env.REGION }}
          env_vars: |
            ENVIRONMENT=production
            DEBUG=false
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            REDIS_URL=REDIS_URL:latest
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            JWT_SECRET=JWT_SECRET:latest
          # min-instances=0: a warm instance bills ~24/7, and this app has zero
          # users — cold starts are the right trade until launch. Raise it only
          # when real traffic makes cold-start latency a measured problem.
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --memory=1Gi
            --cpu=1
            --concurrency=80
            --timeout=60s

      - name: Show URL
        # This is the value to paste into gradle.properties as
        # climaaiApiBaseUrl=<url> once the backend is live.
        run: |
          echo "Deployed to: ${{ steps.deploy.outputs.url }}"

  # ==========================================================================
  # Post-Deploy Health Check
  # ==========================================================================
  health-check:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health Check
        # The URL comes from the deploy step's output: Cloud Run URLs embed the
        # project *number* (or a hash), so guessing one from the project id
        # produces a hostname that never resolves. /health answers 200 even in
        # degraded (no database yet) mode — it reports per-component status —
        # so a fresh project's first deploy passes this gate.
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ needs.deploy.outputs.url }}/health")
          if [ "$response" != "200" ]; then
            echo "Health check failed with status: $response"
            exit 1
          fi
          echo "Health check passed!"
