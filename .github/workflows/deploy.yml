# ClimaAI CI/CD Pipeline
# Deploy to Google Cloud Run on push to main

name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: climaai-api
  REGISTRY: gcr.io

jobs:
  # ==========================================================================
  # Build and Test
  # ==========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          cd backend/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
          
      - name: Run tests
        run: |
          cd backend/api
          python -m pytest tests/ -v
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key
          OPENAI_API_KEY: test-key

  # ==========================================================================
  # Build Docker Image
  # ==========================================================================
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker
        
      - name: Build and Push
        id: build
        run: |
          IMAGE="${REGISTRY}/${PROJECT_ID}/${SERVICE_NAME}:${{ github.sha }}"
          docker build -t ${IMAGE} ./backend/api
          docker push ${IMAGE}
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

  # ==========================================================================
  # Deploy to Cloud Run
  # ==========================================================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ needs.build.outputs.image }}
          region: ${{ env.REGION }}
          env_vars: |
            ENVIRONMENT=production
            DEBUG=false
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            REDIS_URL=REDIS_URL:latest
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            JWT_SECRET=JWT_SECRET:latest
          flags: |
            --allow-unauthenticated
            --min-instances=1
            --max-instances=10
            --memory=1Gi
            --cpu=1
            --concurrency=80
            --timeout=60s

      - name: Show URL
        run: |
          echo "Deployed to: https://${SERVICE_NAME}-${PROJECT_ID}.run.app"

  # ==========================================================================
  # Post-Deploy Health Check
  # ==========================================================================
  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Wait for deployment
        run: sleep 30
        
      - name: Health Check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${SERVICE_NAME}-${PROJECT_ID}.run.app/health)
          if [ "$response" != "200" ]; then
            echo "Health check failed with status: $response"
            exit 1
          fi
          echo "Health check passed!"
