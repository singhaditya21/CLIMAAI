# Mobile CI — builds and tests both apps on hosted runners.
#
# This exists because the project has no physical test devices. Neither app needs
# one: Android runs on an emulator, iOS on a simulator, and GitHub's macos
# runners ship Xcode pre-installed. So iOS is covered here even on a machine with
# no local Xcode at all.

name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile.yml'
      # This workflow runs scripts/collect-artifacts.sh, so a change to it is a
      # change to CI. Leaving scripts/ out meant a broken script could land and
      # keep landing without a single run being triggered to catch it.
      - 'scripts/**'
      # Already matched by scripts/** above. Named anyway so that narrowing that
      # pattern later cannot silently stop running the gates that decide whether
      # this workflow blocks anything.
      - 'scripts/ci/**'
      # The api-contract job compares Android against the backend's own schema,
      # so either side moving can break it. Without this the backend could
      # rename a query param and the Android job would stay green until someone
      # happened to touch android/.
      - 'backend/api/**'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - 'scripts/**'
      - 'scripts/ci/**'
      - 'backend/api/**'
  workflow_dispatch:

jobs:
  # ==========================================================================
  # Static analysis — the defects that compile
  # ==========================================================================
  #
  # Everything the rest of this workflow checks, it checks by running code. That
  # leaves a blind spot the size of the app: a screen nothing navigates to, an
  # initialize() nobody calls, a targetSdk Play will reject. All of it compiles,
  # lints and unit-tests clean, because nothing is malformed — something is
  # simply absent.
  #
  # No JDK, no SDK, no Gradle, no emulator: these read source text, so the whole
  # job is seconds. That is why the Android build waits on it — there is no
  # sense spending eight minutes assembling a bundle Play would refuse.
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reachability
        run: ./scripts/ci/check-reachability.sh

      # Runs even when the gate above failed: a PR should see every finding in
      # one pass rather than one per push.
      - name: Release config
        if: ${{ !cancelled() }}
        run: ./scripts/ci/check-release-config.sh

  # ==========================================================================
  # Android — assemble + unit tests + lint
  # ==========================================================================
  android:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.13's bundled Groovy cannot parse class files from JDK 24+.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      # lintRelease, not :app:lintDebug. Two things were being skipped: the
      # release build type, where the checks that matter for a shipped artifact
      # live (the debug variant is exempt from several of them), and the :wear
      # module, which :app: excluded entirely — it has shipped unlinted since it
      # was added.
      - name: Lint
        working-directory: android
        run: ./gradlew lintRelease

      # Same layout as a local run — see dist/README.md.
      - name: Collect artifacts
        run: ./scripts/collect-artifacts.sh android

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: dist/Android/debug/

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/wear/build/reports/

  # ==========================================================================
  # Android — instrumented smoke test on a real emulator
  # ==========================================================================
  #
  # assembleDebug proves the app links. It does not prove the app starts, and it
  # cannot: a crash in onCreate, a missing notification channel, a flag written
  # on one launch and never read on the next are all runtime-only. Robolectric
  # unit tests do not cover them either — they never run an Activity through a
  # real lifecycle twice.
  android-smoke:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Without this the emulator falls back to software rendering and takes
      # long enough to hit the job timeout. ubuntu-latest has the KVM device but
      # does not expose it to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 26 because that is app/build.gradle's minSdk. Testing on the newest
      # image would prove the app works everywhere except the oldest device it
      # claims to support, which is exactly where startup breaks first.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
          working-directory: android

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/

  # ==========================================================================
  # API contract — Android's Retrofit interface vs the backend's own schema
  # ==========================================================================
  #
  # The Retrofit interface is a promise about a server the Kotlin compiler has
  # never seen, and the unit tests mock the very interface that might be wrong.
  # A renamed query param or a moved route is green on both sides and 404s in
  # production. Diffing against the running backend's /openapi.json is the only
  # thing that notices.
  api-contract:
    runs-on: ubuntu-latest
    # Same image and credentials as the backend's own test job in deploy.yml, so
    # the schema this gate reads is the schema that job validates.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: climaai
          POSTGRES_PASSWORD: climaai123
          POSTGRES_DB: climaai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r backend/api/requirements.txt

      # No Redis service: every cache client in the backend is created on first
      # use, so serving the schema never reaches one.
      - name: Boot the backend
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql+asyncpg://climaai:climaai123@localhost:5432/climaai
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-secret-key
          OPENAI_API_KEY: ci-key
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/backend.log 2>&1 &

      # No sleep or wait-for-port step: the script polls the schema URL until it
      # answers and fails loudly if it never does, so a slow boot cannot turn
      # into either a flake or a silent pass.
      - name: Diff Retrofit against /openapi.json
        run: ./scripts/ci/check-api-contract.py

      - name: Backend log
        if: failure()
        run: cat /tmp/backend.log

  # ==========================================================================
  # Android — release bundle, unsigned unless secrets are present
  # ==========================================================================
  android-release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    env:
      # The `secrets` context cannot be used in an `if:` condition, so it is
      # surfaced as an env var that the conditions below can read.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Absent these secrets the build falls back to debug signing, which still
      # verifies the release path compiles and shrinks. See android/SIGNING.md.
      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > android/release.jks

      - name: Bundle release
        working-directory: android
        env:
          # Only name a keystore when one was actually decoded. Setting this
          # unconditionally made build.gradle enable the release signing config
          # and then fail in validateSigningRelease looking for a file the
          # skipped decode step never wrote — defeating the debug-signing
          # fallback this job is supposed to have.
          ANDROID_KEYSTORE_FILE: ${{ env.KEYSTORE_B64 != '' && 'release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Collect artifacts
        run: ./scripts/collect-artifacts.sh android

      # Includes mapping.txt alongside the AAB — release crash reports are
      # unreadable without the mapping file from that exact build.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/Android/release/

  # ==========================================================================
  # iOS — build for a simulator, then run the test suite on one
  # ==========================================================================
  ios:
    # macos-15, not macos-14: XcodeGen writes objectVersion 77 (the Xcode 16
    # pbxproj format) and Xcode 15.4 on the macos-14 image cannot read it —
    # xcodebuild fails with "Unable to read project" before compiling anything.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      # Regenerate so the build exercises project.yml rather than only the
      # committed project — that is what keeps the spec honest.
      - name: Regenerate project from project.yml
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      # Reported, not enforced. XcodeGen writes its own `objectVersion` into the
      # pbxproj, so the committed file differs whenever CI's XcodeGen release is
      # not the exact one it was generated with. Failing on that would pin the
      # repo to a single XcodeGen version for no real benefit: the build below
      # already proves the spec produces a working project.
      - name: Report drift from the committed project
        run: |
          cd ios
          if git diff --quiet ClimaAI.xcodeproj; then
            echo "Committed project matches this XcodeGen's output."
          else
            echo "::notice::ClimaAI.xcodeproj differs from what this XcodeGen produces."
            git diff --stat ClimaAI.xcodeproj
            echo "Usually just objectVersion. Run 'cd ios && xcodegen generate' to resync."
          fi

      # Discover a simulator rather than naming one. Hardcoding "iPhone 15"
      # broke as soon as the runner image moved to Xcode 16.4, whose simulator
      # set starts at iPhone 16.
      - name: Pick a simulator
        id: sim
        run: |
          # One line deliberately: a multi-line python -c inside YAML inside
          # shell is a three-way quoting hazard. Picks the last available
          # iPhone, skipping watchOS runtimes and unavailable devices.
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[v for rt,ds in d.items() if 'iOS' in rt for v in ds if v.get('isAvailable') and 'iPhone' in v['name']]; print(c[-1]['udid'] if c else '')")
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl list devices available | grep -i "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Signing is off: a simulator build needs no certificate, so this runs
      # without any Apple Developer credentials.
      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project ClimaAI.xcodeproj \
            -scheme ClimaAI \
            -destination 'id=${{ steps.sim.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test on simulator
        working-directory: ios
        run: |
          xcodebuild test \
            -project ClimaAI.xcodeproj \
            -scheme ClimaAI \
            -destination 'id=${{ steps.sim.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
