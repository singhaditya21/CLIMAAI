# Mobile CI — builds and tests both apps on hosted runners.
#
# This exists because the project has no physical test devices. Neither app needs
# one: Android runs on an emulator, iOS on a simulator, and GitHub's macos
# runners ship Xcode pre-installed. So iOS is covered here even on a machine with
# no local Xcode at all.

name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
  workflow_dispatch:

jobs:
  # ==========================================================================
  # Android — assemble + unit tests + lint
  # ==========================================================================
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.13's bundled Groovy cannot parse class files from JDK 24+.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug

      # Same layout as a local run — see dist/README.md.
      - name: Collect artifacts
        run: ./scripts/collect-artifacts.sh android

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: dist/Android/debug/

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/wear/build/reports/

  # ==========================================================================
  # Android — release bundle, unsigned unless secrets are present
  # ==========================================================================
  android-release:
    runs-on: ubuntu-latest
    needs: android
    if: github.ref == 'refs/heads/main'
    env:
      # The `secrets` context cannot be used in an `if:` condition, so it is
      # surfaced as an env var that the conditions below can read.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Absent these secrets the build falls back to debug signing, which still
      # verifies the release path compiles and shrinks. See android/SIGNING.md.
      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 -d > android/release.jks

      - name: Bundle release
        working-directory: android
        env:
          # Only name a keystore when one was actually decoded. Setting this
          # unconditionally made build.gradle enable the release signing config
          # and then fail in validateSigningRelease looking for a file the
          # skipped decode step never wrote — defeating the debug-signing
          # fallback this job is supposed to have.
          ANDROID_KEYSTORE_FILE: ${{ env.KEYSTORE_B64 != '' && 'release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Collect artifacts
        run: ./scripts/collect-artifacts.sh android

      # Includes mapping.txt alongside the AAB — release crash reports are
      # unreadable without the mapping file from that exact build.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/Android/release/

  # ==========================================================================
  # iOS — build for a simulator, then run the test suite on one
  # ==========================================================================
  ios:
    # macos-15, not macos-14: XcodeGen writes objectVersion 77 (the Xcode 16
    # pbxproj format) and Xcode 15.4 on the macos-14 image cannot read it —
    # xcodebuild fails with "Unable to read project" before compiling anything.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      # Regenerate so the build exercises project.yml rather than only the
      # committed project — that is what keeps the spec honest.
      - name: Regenerate project from project.yml
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      # Reported, not enforced. XcodeGen writes its own `objectVersion` into the
      # pbxproj, so the committed file differs whenever CI's XcodeGen release is
      # not the exact one it was generated with. Failing on that would pin the
      # repo to a single XcodeGen version for no real benefit: the build below
      # already proves the spec produces a working project.
      - name: Report drift from the committed project
        run: |
          cd ios
          if git diff --quiet ClimaAI.xcodeproj; then
            echo "Committed project matches this XcodeGen's output."
          else
            echo "::notice::ClimaAI.xcodeproj differs from what this XcodeGen produces."
            git diff --stat ClimaAI.xcodeproj
            echo "Usually just objectVersion. Run 'cd ios && xcodegen generate' to resync."
          fi

      # Discover a simulator rather than naming one. Hardcoding "iPhone 15"
      # broke as soon as the runner image moved to Xcode 16.4, whose simulator
      # set starts at iPhone 16.
      - name: Pick a simulator
        id: sim
        run: |
          # One line deliberately: a multi-line python -c inside YAML inside
          # shell is a three-way quoting hazard. Picks the last available
          # iPhone, skipping watchOS runtimes and unavailable devices.
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[v for rt,ds in d.items() if 'iOS' in rt for v in ds if v.get('isAvailable') and 'iPhone' in v['name']]; print(c[-1]['udid'] if c else '')")
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl list devices available | grep -i "$UDID" || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Signing is off: a simulator build needs no certificate, so this runs
      # without any Apple Developer credentials.
      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project ClimaAI.xcodeproj \
            -scheme ClimaAI \
            -destination 'id=${{ steps.sim.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test on simulator
        working-directory: ios
        run: |
          xcodebuild test \
            -project ClimaAI.xcodeproj \
            -scheme ClimaAI \
            -destination 'id=${{ steps.sim.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
