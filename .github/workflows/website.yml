name: Weather website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/tests/weather-site.test.mjs'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/tests/weather-site.test.mjs'
      - '.github/workflows/website.yml'
  workflow_dispatch:

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser module syntax
        run: node --check docs/assets/weather.mjs
      - name: Test provider contract and error handling
        run: node --test scripts/tests/weather-site.test.mjs
