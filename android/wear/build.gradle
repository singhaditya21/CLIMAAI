plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.climaai.wear'
    compileSdk 36

    defaultConfig {
        applicationId "com.climaai.wear"
        minSdk 30
        // Wear OS is carved out of the phone requirement: Play asks watch apps
        // for API 35 or higher, not 36. Targeting 35 meets that; targeting 36
        // would opt this module into Android 16 behaviour changes (predictive
        // back, large-screen resizability) that nothing here has been run
        // against. Compiled against 36 either way.
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        compose true
    }
    
    composeOptions {
        // Must match the Kotlin version in the root build.gradle (1.9.22), same
        // as app/. Left at 1.5.3 (which pairs with Kotlin 1.9.10) this fails to
        // compile outright.
        kotlinCompilerExtensionVersion '1.5.10'
    }
}

dependencies {
    // Wear OS
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    implementation 'androidx.wear:wear:1.3.0'
    
    // Compose for Wear OS
    implementation platform('androidx.compose:compose-bom:2024.01.00')
    implementation 'androidx.wear.compose:compose-material:1.2.1'
    implementation 'androidx.wear.compose:compose-foundation:1.2.1'
    implementation 'androidx.wear.compose:compose-navigation:1.2.1'
    
    // Tiles
    implementation 'androidx.wear.tiles:tiles:1.2.0'
    implementation 'androidx.wear.tiles:tiles-material:1.2.0'
    
    // Complications
    implementation 'androidx.wear.watchface:watchface-complications-data-source:1.2.1'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Location — same version as app/. Fused rather than the platform
    // LocationManager because it is the only provider that falls back to the
    // tethered phone on watches without their own GPS.
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    // TileService returns ListenableFuture; scope.future { } comes from here.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.7.3'
}
