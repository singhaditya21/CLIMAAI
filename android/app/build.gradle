plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

// Release signing credentials.
//
// Local builds read android/keystore.properties (gitignored). CI reads the same
// four values from environment variables so the keystore never enters the repo.
// When neither is present the release build falls back to debug signing, which
// keeps `assembleRelease` working locally but produces an artifact Play will
// reject — see android/SIGNING.md.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystoreFile = keystorePropertiesFile.exists()
if (hasKeystoreFile) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingValue = { String key, String envVar ->
    hasKeystoreFile ? keystoreProperties[key] : System.getenv(envVar)
}

def releaseStorePath = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')
def hasReleaseSigning = releaseStorePath != null && !releaseStorePath.isEmpty()

android {
    namespace 'com.climaai.app'
    // Play stops accepting new submissions below API 36 on 2026-08-31 (API 35 is
    // the floor for an update to keep reaching existing users). AGP 8.13 is
    // tested up to 36, so this is as high as the toolchain goes.
    compileSdk 36

    defaultConfig {
        applicationId "com.climaai.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStorePath)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", '"https://api.climaai.com"'
            // Paywall stays dark until the weather-data licensing allows charging:
            // Open-Meteo's free tier is non-commercial. Flip only with a commercial
            // data licence in place.
            buildConfigField "boolean", "MONETIZATION_ENABLED", "false"
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            buildConfigField "String", "API_BASE_URL", '"http://10.0.2.2:8000"' // Android emulator localhost
            buildConfigField "boolean", "MONETIZATION_ENABLED", "false"
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
            "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"
        ]
    }
    
    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core Android
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    // Compose
    implementation platform('androidx.compose:compose-bom:2024.02.02')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    
    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    
    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    
    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    
    // Location
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    
    // Glance — Jetpack Compose for app widgets (widget/*.kt import this)
    implementation 'androidx.glance:glance-appwidget:1.0.0'
    implementation 'androidx.glance:glance-material3:1.0.0'

    // Google Play Billing
    //
    // 6.1.0 was below Play's floor twice over: 7.0.0+ is required for uploads
    // today, 8.0.0+ from 2026-08-31.
    //
    // The core artifact, not billing-ktx: every 8.x -ktx build carries Kotlin
    // 2.1 class metadata, which this project's Kotlin 1.9.22 compiler refuses to
    // read ("expected version is 1.9.0"), so depending on it fails the build
    // outright rather than only at some newer version. The core artifact is Java
    // and has no metadata to reject. BillingManager only ever calls the callback
    // API — startConnection, queryProductDetailsAsync, queryPurchasesAsync,
    // acknowledgePurchase, launchBillingFlow — all of which live here; -ktx adds
    // only the suspend wrappers, which nothing uses. Bump Kotlin first if those
    // are ever wanted.
    // AndroidManifest.xml declares this same version to Play; keep them in step.
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    
    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'
    
    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    
    // Lottie for animated icons
    implementation 'com.airbnb.android:lottie-compose:6.3.0'
    
    // Custom fonts (Google Fonts)
    implementation 'androidx.compose.ui:ui-text-google-fonts'
    
    // Animations
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.animation:animation-graphics'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    // Robolectric gives JVM tests a real SharedPreferences, so widget data
    // can be round-tripped without an emulator.
    //
    // Must ship an android-all image for the module's targetSdk or every test in
    // the class dies at configuration time with "targetSdkVersion=36 >
    // maxSdkVersion", before a single assertion runs. 4.11.1 topped out at 34, so
    // it broke the moment targetSdk went to 36; 4.16 is the first with API 36.
    // Bump this whenever targetSdk moves.
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.02')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
